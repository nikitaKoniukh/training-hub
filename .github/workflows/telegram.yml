name: Telegram bot

on:
  push:
    branches: [main]
    paths: ["outbox/*.json", "requests/bot"]
  schedule:
    # UTC. Israel winter = UTC+2: every 15 min 05:00-05:45 and 18:00-21:45, otherwise every 2 h
    - cron: "*/15 3 * * *"
    - cron: "*/15 16-19 * * *"
    - cron: "7 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Read messages and buttons
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: python -m hub.telegram poll

      - name: Render charts requested by outbox
        run: |
          if grep -lq '"render": *"weekly"' outbox/*.json 2>/dev/null; then
            pip install matplotlib
            python -m hub.weekly --chart
          fi

      - name: Send outbox
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m hub.telegram send

      - name: Rotate Garmin tokens
        if: always()
        uses: ./.github/actions/rotate-tokens
        with:
          gh_pat: ${{ secrets.GH_PAT }}
          current: ${{ secrets.GARMIN_TOKENS }}

      - name: Commit bot state
        if: always()
        run: |
          git config user.name  "training-hub-bot"
          git config user.email "training-hub-bot@users.noreply.github.com"
          git add -A bot/ outbox/ feedback.md logs/ 2>/dev/null || true
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "bot: $(TZ=Asia/Jerusalem date '+%F %H:%M')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
