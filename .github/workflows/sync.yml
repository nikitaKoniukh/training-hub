name: Hub sync (Garmin -> data/)

on:
  schedule:
    # 16:20 UTC = 18:20 Israel in winter (19:20 in summer). Coach runs at 19:00 local.
    - cron: "20 16 * * *"
  push:
    # The coach (no Actions API access) requests a fresh sync by committing this file
    branches: [main]
    paths: ["requests/sync"]
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD (empty = today, Asia/Jerusalem)"
        required: false
      days:
        description: "How many days back to refresh"
        required: false
        default: "2"

permissions:
  contents: write

concurrency:
  group: garmin-api   # one Garmin session at a time (token refresh safety)
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull Garmin data
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: python -m hub.sync ${{ inputs.date }} --days ${{ inputs.days || '2' }}

      - name: Pull 12-week history (weekly review)
        continue-on-error: true
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: python -m hub.history

      - name: Rotate Garmin tokens
        if: always()
        uses: ./.github/actions/rotate-tokens
        with:
          gh_pat: ${{ secrets.GH_PAT }}
          current: ${{ secrets.GARMIN_TOKENS }}

      - name: Commit data
        run: |
          git config user.name  "training-hub-bot"
          git config user.email "training-hub-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "hub: sync $(TZ=Asia/Jerusalem date +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Alert in Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: >-
          python -m hub.telegram alert "Синк Garmin упал (часто это токены: повтори bootstrap_login.py) — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
