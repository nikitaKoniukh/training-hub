name: Watchdog (coach results)

# Checks that the Claude coach runs produced a report, a Telegram message and pushed workouts.
# Alerts in Telegram if not. Independent of Claude and of the Claude app's push notifications.
on:
  schedule:
    # UTC. Two times per check so one of them is in the local window in both winter (UTC+2)
    # and summer (UTC+3); hub.watchdog auto ignores the other.
    - cron: "35 2,3 * * *"     # morning check  ~05:35 local (coach 05:10)
    - cron: "45 16,17 * * *"   # evening check  ~19:45 local (coach 18:45)
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | evening | morning"
        required: false
        default: "auto"
      dry_run:
        description: "Only print, don't send to Telegram"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check coach results
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          mode="${{ inputs.mode || 'auto' }}"
          extra=""
          [ "${{ inputs.dry_run }}" = "true" ] && extra="--dry-run"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$mode" = "auto" ] && extra="$extra --force"
          python -m hub.watchdog "$mode" $extra

      - name: Alert if the watchdog itself broke
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: >-
          python -m hub.telegram alert "Watchdog упал, проверь тренера вручную — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
