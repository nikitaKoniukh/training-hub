name: Push workout to Garmin

on:
  push:
    branches: [main]
    paths: ["workouts/*.json", "requests/garmin_delete"]
  workflow_dispatch:
    inputs:
      file:
        description: "workouts/YYYY-MM-DD.json"
        required: true

permissions:
  contents: write

concurrency:
  group: garmin-api
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Find changed workout files
        id: files
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            files="${{ inputs.file }}"
          else
            files=$(git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- 'workouts/*.json' 2>/dev/null \
                    || git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'workouts/*.json')
          fi
          echo "files=$(echo $files | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          echo "Files: $files"
          deleted=""
          if [ "${{ github.event_name }}" = "push" ]; then
            deleted=$(git diff --name-only --diff-filter=D "${{ github.event.before }}" "${{ github.sha }}" -- 'workouts/*.json' 2>/dev/null || true)
          fi
          echo "deleted=$(echo $deleted | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          echo "Deleted: $deleted"

      - name: Delete orphan workouts by id (requests/garmin_delete)
        id: del
        if: github.event_name == 'push'
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: |
          git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- requests/garmin_delete 2>/dev/null | grep -q . || exit 0
          ids=$(grep -oE '^[0-9]+' requests/garmin_delete | tr '\n' ' ')
          [ -z "$ids" ] && exit 0
          python -m hub.push_workout delete $ids
          : > requests/garmin_delete
          echo "done=1" >> "$GITHUB_OUTPUT"

      - name: Upload and schedule
        if: steps.files.outputs.files != ''
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: python -m hub.push_workout ${{ steps.files.outputs.files }}

      - name: Cancel workouts whose files were deleted
        if: steps.files.outputs.deleted != ''
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: |
          for f in ${{ steps.files.outputs.deleted }}; do
            python -m hub.push_workout cancel "$(basename "$f" .json)"
          done

      - name: Rotate Garmin tokens
        if: always()
        uses: ./.github/actions/rotate-tokens
        with:
          gh_pat: ${{ secrets.GH_PAT }}
          current: ${{ secrets.GARMIN_TOKENS }}

      - name: Commit push log
        if: always() && (steps.files.outputs.files != '' || steps.files.outputs.deleted != '' || steps.del.outputs.done == '1')
        run: |
          git config user.name  "training-hub-bot"
          git config user.email "training-hub-bot@users.noreply.github.com"
          git add logs/ requests/garmin_delete 2>/dev/null || git add logs/
          git diff --cached --quiet && exit 0
          git commit -m "hub: pushed ${{ steps.files.outputs.files }}"
          # main is busy (coach, bot, sync commit concurrently) — a lost log means duplicates in Garmin
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          echo "::error::push log not saved"
          exit 1

      - name: Alert in Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: >-
          python -m hub.telegram alert "Ошибка отправки в Garmin или лог logs/pushed.jsonl не сохранился (возможны дубли в календаре) — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
